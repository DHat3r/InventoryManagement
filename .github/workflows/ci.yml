name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar paquetes
        run: dotnet restore InventoryManagement.sln

      - name: Compilar
        run: dotnet build InventoryManagement.sln --no-restore -c Release

      # Falla si alguien cambió las entidades y olvidó crear la migración.
      - name: Chequear migraciones pendientes
        run: |
          dotnet tool install -g dotnet-ef --version 8.0.10
          dotnet ef migrations has-pending-model-changes --project InventoryManagement.Api --no-build --configuration Release

      # Los tests de integración levantan PostgreSQL con Testcontainers;
      # los runners de GitHub ya traen Docker.
      - name: Tests
        run: >
          dotnet test InventoryManagement.Tests --no-build -c Release
          --collect:"XPlat Code Coverage" --results-directory coverage

      # Las migraciones son código generado: se excluyen para no distorsionar el porcentaje.
      - name: Reporte de cobertura
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:coverage-report \
            -reporttypes:"Html;MarkdownSummaryGithub" -classfilters:"-InventoryManagement.Api.Migrations.*"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage-report

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci instala exactamente lo del package-lock.json (reproducible)
      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compilar (TypeScript + Vite)
        run: npm run build
